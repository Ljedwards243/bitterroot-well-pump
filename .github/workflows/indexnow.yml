name: IndexNow

# Vercel reports deployment statuses to GitHub. When a production deploy succeeds,
# tell Bing (and other IndexNow engines) which URLs exist so changes are crawled quickly.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
